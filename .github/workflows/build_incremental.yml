name: Build Up + OC (incremental, auto-push)

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      target_sublevel:
        description: 'Target SUBLEVEL 4.14.xxx (kosongin = auto naik 5 level dari SUBLEVEL sekarang)'
        type: string
        required: false
        default: ''
      oc_step:
        description: 'Tahap OC (freq+volt sepasang, nurutin kurva Takumi123w/kernel-a01c -- sama-sama MT6739)'
        type: choice
        required: true
        default: 'step2_1359mhz'
        options:
          - stock_no_oc
          - step1_1307mhz
          - step2_1359mhz
          - step3_1411mhz
          - step4_1476mhz
          - step5_1580mhz
          - step6_1684mhz
          - step7_1801mhz_MAX_A01C

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Kernel
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: true

      - name: Install Toolchain & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev gcc-arm-linux-gnueabi

      - name: Tentukan versi current & target
        id: ver
        run: |
          CURRENT_SUBLEVEL=$(grep "^SUBLEVEL =" Makefile | awk '{print $3}')
          echo "SUBLEVEL sekarang: $CURRENT_SUBLEVEL"

          INPUT_TARGET="${{ github.event.inputs.target_sublevel }}"
          if [ -n "$INPUT_TARGET" ]; then
            TARGET_SUBLEVEL="$INPUT_TARGET"
            echo "Target diisi manual: $TARGET_SUBLEVEL"
          else
            TARGET_SUBLEVEL=$((CURRENT_SUBLEVEL + 5))
            echo "Target auto (current+5): $TARGET_SUBLEVEL"
          fi

          if [ "$TARGET_SUBLEVEL" -le "$CURRENT_SUBLEVEL" ]; then
            echo "::error::Target ($TARGET_SUBLEVEL) harus lebih besar dari current ($CURRENT_SUBLEVEL)."
            exit 1
          fi

          echo "current=$CURRENT_SUBLEVEL" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET_SUBLEVEL" >> "$GITHUB_OUTPUT"

      - name: Apply Upstream Patch
        run: |
          CURRENT="${{ steps.ver.outputs.current }}"
          TARGET="${{ steps.ver.outputs.target }}"

          # git.kernel.org kadang kasih 502/503. Retry beberapa kali dulu,
          # kalau tetap gagal baru coba mirror GitHub sebagai cadangan.
          FETCH_OK=0
          for i in 1 2 3; do
            echo "Percobaan fetch ke git.kernel.org (ke-$i)..."
            git remote add stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux-stable.git 2>/dev/null || true
            if git fetch stable "tag" "v4.14.$CURRENT" "tag" "v4.14.$TARGET" --no-tags --depth 1; then
              FETCH_OK=1
              break
            fi
            echo "Gagal, tunggu sebentar sebelum retry..."
            sleep 10
          done

          if [ "$FETCH_OK" -eq 0 ]; then
            echo "::warning::git.kernel.org gagal terus, coba mirror GitHub (gregkh/linux)..."
            git remote remove stable 2>/dev/null || true
            git remote add stable https://github.com/gregkh/linux.git 2>/dev/null || true
            if git fetch stable "tag" "v4.14.$CURRENT" "tag" "v4.14.$TARGET" --no-tags --depth 1; then
              FETCH_OK=1
            fi
          fi

          if [ "$FETCH_OK" -eq 0 ]; then
            echo "::error::Tag v4.14.$CURRENT / v4.14.$TARGET nggak ketemu di git.kernel.org maupun mirror GitHub. Build dihentikan (nggak ada yang bisa di-upgrade)."
            exit 1
          fi

          mkdir -p /tmp/release
          git diff "v4.14.$CURRENT" "v4.14.$TARGET" -- arch/arm/ drivers/ include/ kernel/ mm/ net/ sound/ Makefile > upgrade.patch

          # Exit code patch != 0 itu WAJAR -- banyak file udah di-backport
          # duluan sama vendor tree. Kita nggak berhenti di sini; .rej yang
          # tersisa cuma di-log, bukan bikin build gagal (lihat step
          # berikutnya). Gerbang keberhasilan yang sebenarnya adalah: build
          # sukses + tes langsung di HP.
          set +e
          patch -p1 --forward --batch --no-backup-if-mismatch < upgrade.patch
          PATCH_EXIT=$?
          set -e
          echo "Exit code patch: $PATCH_EXIT"

      - name: Log & Bersihkan .rej (tidak menggagalkan build)
        run: |
          mkdir -p /tmp/release
          ALL_REJECTS=$(find . -name "*.rej" 2>/dev/null || true)
          if [ -n "$ALL_REJECTS" ]; then
            echo "$ALL_REJECTS" | sed 's|^\./||' | sort > /tmp/release/rej_list.txt
          else
            : > /tmp/release/rej_list.txt
          fi
          if [ -n "$ALL_REJECTS" ]; then
            echo "::warning::Ada file .rej (hunk yang gagal apply otomatis, biasanya karena udah di-backport vendor tree). Isinya dicetak di bawah buat referensi, TIDAK menghentikan build:"
            for f in $ALL_REJECTS; do
              echo "--- $f ---"
              cat "$f"
            done
            find . -name "*.rej" -delete
            find . \( -path ./out -o -path ./toolchain -o -path ./.git \) -prune -o -name "*.orig" -type f -delete
          else
            echo "Nggak ada .rej, patch nempel bersih semua."
          fi

          NEW_SUBLEVEL=$(grep "^SUBLEVEL =" Makefile | awk '{print $3}')
          echo "SUBLEVEL sekarang setelah patch: $NEW_SUBLEVEL (target diminta: ${{ steps.ver.outputs.target }})"

      - name: Fix sound/usb/card.h (field stream_offset_adj hilang)
        run: |
          FILE="sound/usb/card.h"

          # BUG NYATA: hunk yang nambahin field "stream_offset_adj" ke struct
          # gagal apply di file ini (struct udah beda), tapi hunk lain di
          # sound/usb/pcm.c yang MAKAI "subs->stream_offset_adj" BERHASIL
          # nempel. Hasilnya field dipakai tapi nggak pernah dideklarasi
          # -> compile error "no member named 'stream_offset_adj'".
          # Fix: sisipkan field itu tepat setelah field lawas
          # pkt_offset_adj, sama seperti upstream. Nggak nyentuh field lain.
          if grep -q "stream_offset_adj" "$FILE"; then
            echo "Field stream_offset_adj sudah ada, skip."
          elif grep -q "unsigned int pkt_offset_adj;" "$FILE"; then
            sed -i '/unsigned int pkt_offset_adj;/a\\tunsigned int stream_offset_adj;\t/* Bytes to drop from beginning of stream (for non-compliant devices) */' "$FILE"
            echo "Field stream_offset_adj ditambahin setelah pkt_offset_adj."
          else
            echo "::warning::Baris pkt_offset_adj nggak ketemu di $FILE -- kemungkinan struktur udah beda di level ini. Skip fix ini (bukan error fatal)."
          fi

          echo "--- Preview hasil fix ---"
          grep -n -B1 -A1 "stream_offset_adj" "$FILE" || true

      - name: Fix drivers/spi/spi-mt65xx.c (uninitialized reg_val)
        run: |
          FILE="drivers/spi/spi-mt65xx.c"

          # Hunk yang menghapus inisialisasi "reg_val = 0" -> "reg_val"
          # berhasil apply, tapi hunk pengganti logic-nya gagal (fungsi
          # vendor sudah dimodifikasi). Hasilnya reg_val kepake lewat "|="
          # padahal nggak pernah diinisialisasi -- uninitialized variable
          # yang langsung ditulis ke register hardware SPI. Idempotent.
          if grep -q "u32 spi_clk_hz, div, sck_time, cs_time, reg_val = 0;" "$FILE"; then
            echo "reg_val sudah terinisialisasi, skip."
          elif grep -q "u32 spi_clk_hz, div, sck_time, cs_time, reg_val;" "$FILE"; then
            sed -i 's/u32 spi_clk_hz, div, sck_time, cs_time, reg_val;/u32 spi_clk_hz, div, sck_time, cs_time, reg_val = 0;/' "$FILE"
            echo "Inisialisasi reg_val = 0 dikembalikan."
          else
            echo "::warning::Deklarasi reg_val di $FILE nggak ketemu pola yang diharapkan -- kemungkinan struktur fungsi sudah berubah lagi di level ini. Skip fix (bukan error fatal, tapi cek manual kalau ada masalah SPI)."
          fi

      - name: Fix drivers/usb/host/xhci-mtk.c (duplicate pm_runtime call)
        run: |
          FILE="drivers/usb/host/xhci-mtk.c"

          # Hunk penambah blok baru di awal xhci_mtk_remove() berhasil,
          # tapi hunk penghapus blok lama yang setara gagal (konteks beda).
          # Hasilnya pm_runtime_put_noidle()+pm_runtime_disable() dipanggil
          # dua kali -- bisa bikin refcount underflow pas suspend/rmmod.
          if [ -f "$FILE" ]; then
            COUNT=$(grep -c "pm_runtime_put_noidle(&dev->dev);" "$FILE" || true)

            if [ "$COUNT" -eq 1 ]; then
              echo "Cuma ada 1 pemanggilan, sudah bersih. Skip."
            elif [ "$COUNT" -ge 2 ]; then
              python3 - "$FILE" <<'PYEOF'
          import sys
          path = sys.argv[1]
          with open(path) as f:
              content = f.read()

          block = "\tpm_runtime_put_noidle(&dev->dev);\n\tpm_runtime_disable(&dev->dev);\n\n"
          first = content.find(block)
          second = content.find(block, first + len(block))

          if first == -1 or second == -1:
              print("::warning::Pola blok duplikat tidak ditemukan persis, skip fix ini.")
              sys.exit(0)

          content = content[:second] + content[second + len(block):]
          with open(path, "w") as f:
              f.write(content)
          print("Blok duplikat kedua dihapus.")
          PYEOF
            else
              echo "Pola pm_runtime_put_noidle nggak ketemu, kemungkinan udah beda di level ini. Skip."
            fi
          else
            echo "File $FILE nggak ada di level ini, skip."
          fi

      - name: Fix MediaTek SPI Timing Offset (macro hilang)
        run: |
          FILE="drivers/spi/spi-mt65xx.c"

          # BUG YANG BIKIN COMPILE ERROR: hunk yang harusnya ganti logic
          # reg_val (pakai SPI_CFG2_SCK_HIGH/LOW_OFFSET) gagal nempel di
          # fungsi vendor yang udah dimodif, tapi body fungsi TETAP makai
          # macro lama SPI_ADJUST_CFG0_SCK_LOW_OFFSET yang udah kehapus
          # dari header -- makanya "undeclared identifier". Nilai 16 ini
          # dikonfirmasi dari patch resmi MediaTek (Leilk Liu, "spi:
          # mediatek: adjust register to enhance time accuracy").
          if grep -q "^#define SPI_ADJUST_CFG0_SCK_LOW_OFFSET" "$FILE"; then
            echo "Guard sudah ada, skip insert."
          elif grep -q "SPI_ADJUST_CFG0_SCK_LOW_OFFSET" "$FILE"; then
            LAST_INCLUDE_LINE=$(grep -n '^#include' "$FILE" | tail -1 | cut -d: -f1)
            awk -v n="$LAST_INCLUDE_LINE" '{print} NR==n {print "#ifndef SPI_ADJUST_CFG0_SCK_LOW_OFFSET"; print "#define SPI_ADJUST_CFG0_SCK_LOW_OFFSET 16"; print "#endif"}' "$FILE" > "$FILE.tmp" && mv "$FILE.tmp" "$FILE"
            echo "Macro SPI_ADJUST_CFG0_SCK_LOW_OFFSET ditambahin (nilai 16)."
          else
            echo "Macro SPI_ADJUST_CFG0_SCK_LOW_OFFSET nggak dipakai di level ini, skip."
          fi

          echo "--- Preview hasil fix ---"
          grep -n -A3 -B3 "SPI_ADJUST_CFG0_SCK_LOW_OFFSET" "$FILE" || true

      - name: Fix lib/random32.c (net_rand_state static mismatch)
        run: |
          FILE="lib/random32.c"

          # Bukan dari .rej -- ini inkonsistensi lama di source: random32.c
          # deklarasi "static", tapi prandom.h deklarasi non-static (extern,
          # sengaja di-share ke file lain kayak net/core/utils.c). GCC cuma
          # warning soal ini, tapi clang (dipakai di build kita) jadiin error
          # keras. Fix: hapus "static" di random32.c biar cocok sama header.
          if grep -q "^static DEFINE_PER_CPU(struct rnd_state, net_rand_state)" "$FILE"; then
            sed -i 's/^static DEFINE_PER_CPU(struct rnd_state, net_rand_state)/DEFINE_PER_CPU(struct rnd_state, net_rand_state)/' "$FILE"
            echo "Keyword 'static' dihapus dari deklarasi net_rand_state."
          elif grep -q "^DEFINE_PER_CPU(struct rnd_state, net_rand_state)" "$FILE"; then
            echo "Sudah non-static, skip."
          else
            echo "Pola net_rand_state nggak ketemu di level ini, skip."
          fi

          echo "--- Preview hasil fix ---"
          grep -n "net_rand_state" "$FILE" || true

      - name: Fix mm/memory.c (cow_user_page signature lama)
        run: |
          FILE="mm/memory.c"

          # Hunk yang update call site "cow_user_page(new_page, old_page,
          # vmf->address, vma)" ke signature baru "cow_user_page(new_page,
          # old_page, vmf)" gagal nempel (.rej), padahal definisi fungsinya
          # di tempat lain udah ke-update ke 3 argumen (return bool). Hasil:
          # call site lama masih makai 4 argumen -> "too many arguments".
          if grep -qF 'cow_user_page(new_page, old_page, vmf->address, vma);' "$FILE"; then
            python3 - "$FILE" <<'PYEOF'
          import sys
          path = sys.argv[1]
          with open(path) as f:
              content = f.read()

          old = "\t\tcow_user_page(new_page, old_page, vmf->address, vma);\n"
          new = (
              "\t\tif (!cow_user_page(new_page, old_page, vmf)) {\n"
              "\t\t\t/*\n"
              "\t\t\t * COW failed, if the fault was solved by other,\n"
              "\t\t\t * it's fine. If not, userspace would re-fault on\n"
              "\t\t\t * the same address and we will handle the fault\n"
              "\t\t\t * from the second attempt.\n"
              "\t\t\t */\n"
              "\t\t\tput_page(new_page);\n"
              "\t\t\tif (old_page)\n"
              "\t\t\t\tput_page(old_page);\n"
              "\t\t\treturn 0;\n"
              "\t\t}\n"
          )

          if old not in content:
              print("::warning::Pola call cow_user_page lama nggak ketemu persis, skip fix.")
              sys.exit(0)

          content = content.replace(old, new, 1)
          with open(path, "w") as f:
              f.write(content)
          print("Call site cow_user_page dibenerin ke signature baru (3 argumen + cek return).")
          PYEOF
          elif grep -qF 'if (!cow_user_page(new_page, old_page, vmf))' "$FILE"; then
            echo "Sudah pakai signature baru, skip."
          else
            echo "Pola cow_user_page nggak ketemu di level ini, skip."
          fi

      - name: Fix include/linux/overflow.h (fungsi kedobel)
        run: |
          FILE="include/linux/overflow.h"

          # Patch nempel sukses nambahin blok helper (array_size,
          # array3_size, __ab_c_size, dst) yang TERNYATA udah ada duluan di
          # file ini (vendor udah backport dari sumber lain). Hasilnya
          # fungsi yang sama kedefinisi 2x -> "redefinition of ...".
          # Dedup: buat tiap nama fungsi yang lebih dari 1x, cuma sisain
          # definisi PERTAMA, buang sisanya.
          python3 - "$FILE" <<'PYEOF'
          import re
          import sys

          path = sys.argv[1]
          with open(path) as f:
              content = f.read()

          pattern = re.compile(
              r'^static inline __must_check \S+ (\w+)\([^)]*\)\s*\n\{',
              re.MULTILINE,
          )

          matches = list(pattern.finditer(content))
          seen = {}
          spans_to_remove = []

          for m in matches:
              name = m.group(1)
              start = m.start()
              brace_start = content.index('{', m.end() - 1)
              depth = 0
              i = brace_start
              while i < len(content):
                  if content[i] == '{':
                      depth += 1
                  elif content[i] == '}':
                      depth -= 1
                      if depth == 0:
                          break
                  i += 1
              end = i + 1
              # ikutan makan newline setelah '}' biar gak nyisain baris kosong dobel
              if end < len(content) and content[end] == '\n':
                  end += 1

              if name in seen:
                  spans_to_remove.append((start, end))
                  print(f"Duplikat ditemukan & bakal dibuang: {name}")
              else:
                  seen[name] = (start, end)

          if not spans_to_remove:
              print("Nggak ada fungsi kedobel, skip.")
          else:
              spans_to_remove.sort(reverse=True)
              for start, end in spans_to_remove:
                  content = content[:start] + content[end:]
              with open(path, "w") as f:
                  f.write(content)
              print(f"{len(spans_to_remove)} definisi duplikat dibuang dari {path}.")
          PYEOF

          echo "--- Cek ulang, harusnya masing-masing cuma 1x ---"
          grep -n "^static inline __must_check .* \(array_size\|array3_size\|__ab_c_size\)(" "$FILE" || true

      - name: Fix drivers/hid/hid-core.c (fungsi kedobel)
        run: |
          FILE="drivers/hid/hid-core.c"

          # Sama modus kayak overflow.h: hunk nempel sukses nambahin ulang
          # fungsi hid_compute_report_size() yang ternyata udah ada duluan
          # di file ini (vendor udah backport). Hasilnya "redefinition of
          # 'hid_compute_report_size'" -- persis error yang bikin build
          # gagal di step "drivers/hid". Dedup: sisain definisi PERTAMA aja.
          if [ -f "$FILE" ]; then
            COUNT=$(grep -c "^static size_t hid_compute_report_size(struct hid_report \*report)" "$FILE" || true)

            if [ "$COUNT" -le 1 ]; then
              echo "Cuma ada 1 (atau 0) definisi, sudah bersih. Skip."
            else
              python3 - "$FILE" <<'PYEOF'
          import re
          import sys

          path = sys.argv[1]
          with open(path) as f:
              content = f.read()

          pattern = re.compile(
              r'^static size_t hid_compute_report_size\(struct hid_report \*report\)\s*\n\{',
              re.MULTILINE,
          )

          matches = list(pattern.finditer(content))
          spans_to_remove = []

          for idx, m in enumerate(matches):
              if idx == 0:
                  continue
              start = m.start()
              brace_start = content.index('{', m.end() - 1)
              depth = 0
              i = brace_start
              while i < len(content):
                  if content[i] == '{':
                      depth += 1
                  elif content[i] == '}':
                      depth -= 1
                      if depth == 0:
                          break
                  i += 1
              end = i + 1
              if end < len(content) and content[end] == '\n':
                  end += 1
              spans_to_remove.append((start, end))

          spans_to_remove.sort(reverse=True)
          for start, end in spans_to_remove:
              content = content[:start] + content[end:]

          with open(path, "w") as f:
              f.write(content)
          print(f"{len(spans_to_remove)} definisi duplikat hid_compute_report_size dibuang.")
          PYEOF
            fi
          else
            echo "File $FILE nggak ada di level ini, skip."
          fi

          echo "--- Cek ulang, harusnya cuma 1x ---"
          grep -n "^static size_t hid_compute_report_size" "$FILE" || true

      - name: Fix include/linux/khugepaged.h (khugepaged_min_free_kbytes_update belum ada definisi)
        run: |
          FILE="include/linux/khugepaged.h"
          DEFCONFIG="arch/arm/configs/a02_defconfig"

          # BUG: hunk yang nambahin "extern void
          # khugepaged_min_free_kbytes_update(void);" ke header ini nempel
          # sukses, dan hunk pemanggilnya di mm/page_alloc.c (dari
          # init_per_zone_wmark_min()) juga nempel. Tapi definisi fungsinya
          # cuma ada di mm/khugepaged.c, yang di config a02_defconfig ini
          # CONFIG_TRANSPARENT_HUGEPAGE nggak diaktifkan -> mm/khugepaged.c
          # nggak ikut kecompile -> linker teriak "undefined reference to
          # 'khugepaged_min_free_kbytes_update'" pas link vmlinux.
          if grep -q "^CONFIG_TRANSPARENT_HUGEPAGE=y" "$DEFCONFIG" 2>/dev/null; then
            echo "CONFIG_TRANSPARENT_HUGEPAGE aktif di $DEFCONFIG, mm/khugepaged.c seharusnya ikut kecompile. Skip fix ini (kalau masih undefined reference, cek manual)."
          elif grep -qE '^\s*static inline void khugepaged_min_free_kbytes_update\(void\)' "$FILE"; then
            echo "Sudah ada fallback static inline, skip."
          elif grep -qE '^\s*extern void khugepaged_min_free_kbytes_update\(void\);' "$FILE"; then
            sed -i -E 's/^\s*extern void khugepaged_min_free_kbytes_update\(void\);/static inline void khugepaged_min_free_kbytes_update(void) { }/' "$FILE"
            echo "extern diganti jadi static inline no-op (CONFIG_TRANSPARENT_HUGEPAGE off, definisi asli di mm/khugepaged.c nggak kecompile)."
          else
            echo "::warning::Deklarasi khugepaged_min_free_kbytes_update nggak ketemu di $FILE -- kemungkinan struktur udah beda. Skip fix (bukan error fatal, tapi cek manual kalau masih undefined reference pas link)."
          fi

          echo "--- Preview hasil fix ---"
          grep -n "khugepaged_min_free_kbytes_update" "$FILE" || true

      - name: Fix mm/page_alloc.c (include khugepaged.h gagal nempel)
        run: |
          FILE="mm/page_alloc.c"

          # ROOT CAUSE error link "undefined reference to
          # 'khugepaged_min_free_kbytes_update'": hunk #1 di page_alloc.c
          # (#include <linux/khugepaged.h>) GAGAL apply (.rej), tapi hunk #2
          # yang MANGGIL khugepaged_min_free_kbytes_update() berhasil nempel.
          # KCFLAGS=-w nyembunyiin warning implicit declaration, jadi lolos
          # compile lalu meledak di link. Fix: sisipkan include-nya.
          if grep -q '^#include <linux/khugepaged.h>' "$FILE"; then
            echo "Include khugepaged.h sudah ada, skip."
          elif grep -q '^#include <linux/nmi.h>' "$FILE"; then
            sed -i '0,/^#include <linux\/nmi.h>/s//#include <linux\/nmi.h>\n#include <linux\/khugepaged.h>/' "$FILE"
            echo "Include khugepaged.h ditambahin setelah nmi.h."
          else
            LAST=$(grep -n '^#include <linux/' "$FILE" | tail -1 | cut -d: -f1)
            sed -i "${LAST}a #include <linux/khugepaged.h>" "$FILE"
            echo "Include khugepaged.h ditambahin setelah include <linux/*> terakhir (baris $LAST)."
          fi

          echo "--- Preview hasil fix ---"
          grep -n "khugepaged" "$FILE" || true

      - name: Tentukan freq & volt OC dari preset
        id: oc
        run: |
          case "${{ github.event.inputs.oc_step }}" in
            stock_no_oc)
              SKIP_OC=1 ;;
            step1_1307mhz)
              SKIP_OC=0; FREQ=1307000; VOLT=117500 ;;
            step2_1359mhz)
              SKIP_OC=0; FREQ=1359000; VOLT=120000 ;;
            step3_1411mhz)
              SKIP_OC=0; FREQ=1411000; VOLT=122500 ;;
            step4_1476mhz)
              SKIP_OC=0; FREQ=1476000; VOLT=125000 ;;
            step5_1580mhz)
              SKIP_OC=0; FREQ=1580000; VOLT=126875 ;;
            step6_1684mhz)
              SKIP_OC=0; FREQ=1684000; VOLT=128750 ;;
            step7_1801mhz_MAX_A01C)
              SKIP_OC=0; FREQ=1801000; VOLT=130625 ;;
            *)
              echo "::error::oc_step tidak dikenali: ${{ github.event.inputs.oc_step }}"
              exit 1
              ;;
          esac

          if [ "$SKIP_OC" -eq 1 ]; then
            echo "stock_no_oc dipilih, build polos tanpa patch OPP table."
            echo "skip_oc=1" >> "$GITHUB_OUTPUT"
          else
            MAX_SAFE_VOLT=130625
            if [ "$VOLT" -gt "$MAX_SAFE_VOLT" ]; then
              echo "::error::Voltase $VOLT melebihi batas aman terverifikasi ($MAX_SAFE_VOLT). Build dihentikan."
              exit 1
            fi

            echo "Step dipilih: ${{ github.event.inputs.oc_step }} -> FREQ=${FREQ}KHz, VOLT=${VOLT} (10uV)"
            echo "skip_oc=0" >> "$GITHUB_OUTPUT"
            echo "freq=$FREQ" >> "$GITHUB_OUTPUT"
            echo "volt=$VOLT" >> "$GITHUB_OUTPUT"
          fi

      - name: Backup file OPP table asli
        if: steps.oc.outputs.skip_oc == '0'
        run: |
          OPP_FILE="drivers/misc/mediatek/base/power/cpufreq_v2/src/mach/mt6739/mtk_cpufreq_opp_table.h"
          cp "$OPP_FILE" "$OPP_FILE.bak"

      - name: Patch OC (sementara, cuma di runner ini)
        if: steps.oc.outputs.skip_oc == '0'
        run: |
          OPP_FILE="drivers/misc/mediatek/base/power/cpufreq_v2/src/mach/mt6739/mtk_cpufreq_opp_table.h"
          FREQ="${{ steps.oc.outputs.freq }}"
          VOLT="${{ steps.oc.outputs.volt }}"

          sed -i "s/^#define CPU_DVFS_FREQ0_LL_FY\\t\\t[0-9]*\\t\\t\\/\\* KHz \\*\\//#define CPU_DVFS_FREQ0_LL_FY\\t\\t${FREQ}\\t\\t\\/* KHz - OC *\\//" "$OPP_FILE"
          sed -i "s/^#define CPU_DVFS_FREQ0_LL_SB\\t\\t[0-9]*\\t\\t\\/\\* KHz \\*\\//#define CPU_DVFS_FREQ0_LL_SB\\t\\t${FREQ}\\t\\t\\/* KHz - OC *\\//" "$OPP_FILE"
          sed -i "s/^#define CPU_DVFS_FREQ0_LL_FY2\\t\\t[0-9]*\\t\\t\\/\\* KHz \\*\\//#define CPU_DVFS_FREQ0_LL_FY2\\t\\t${FREQ}\\t\\t\\/* KHz - OC *\\//" "$OPP_FILE"

          sed -i "s/^#define CPU_DVFS_VOLT0_VPROC1_FY\\t [0-9]*\\t\\t\\/\\* 10uV \\*\\//#define CPU_DVFS_VOLT0_VPROC1_FY\\t ${VOLT}\\t\\t\\/* 10uV - OC *\\//" "$OPP_FILE"
          sed -i "s/^#define CPU_DVFS_VOLT0_VPROC1_SB\\t [0-9]*\\t\\t\\/\\* 10uV \\*\\//#define CPU_DVFS_VOLT0_VPROC1_SB\\t ${VOLT}\\t\\t\\/* 10uV - OC *\\//" "$OPP_FILE"
          sed -i "s/^#define CPU_DVFS_VOLT0_VPROC1_FY2\\t [0-9]*\\t\\t\\/\\* 10uV \\*\\//#define CPU_DVFS_VOLT0_VPROC1_FY2\\t ${VOLT}\\t\\t\\/* 10uV - OC *\\//" "$OPP_FILE"

      - name: Tampilkan diff hasil patch OC
        if: steps.oc.outputs.skip_oc == '0'
        run: |
          OPP_FILE="drivers/misc/mediatek/base/power/cpufreq_v2/src/mach/mt6739/mtk_cpufreq_opp_table.h"
          diff -u "$OPP_FILE.bak" "$OPP_FILE" || true

      - name: Build Kernel
        run: |
          chmod +x z
          ./z

      - name: Package boot.img-kernel
        run: |
          cd out/arch/arm/boot
          if [ -f "zImage-dtb" ]; then
            cp zImage-dtb boot.img-kernel
          else
            echo "::warning::zImage-dtb tidak ditemukan, fallback ke zImage (DTB terpisah)."
            cp zImage boot.img-kernel
          fi
          ls -l boot.img-kernel

      - name: Buat changelog upstream & zip release
        env:
          CURRENT: ${{ steps.ver.outputs.current }}
          TARGET: ${{ steps.ver.outputs.target }}
          OC_STEP: ${{ github.event.inputs.oc_step }}
        run: |
          mkdir -p /tmp/release
          CL="/tmp/release/CHANGELOG-4.14.${CURRENT}-to-4.14.${TARGET}.txt"
          NEW_SUBLEVEL=$(grep "^SUBLEVEL =" Makefile | awk '{print $3}')

          {
            echo "=============================================================="
            echo " a022f_kernel - Changelog Progress Upstream"
            echo "=============================================================="
            echo "Tanggal build   : $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "Upstream        : linux-stable 4.14.${CURRENT} -> 4.14.${TARGET}"
            echo "SUBLEVEL hasil  : ${NEW_SUBLEVEL}"
            echo "Preset OC       : ${OC_STEP}"
            echo "Branch          : ${GITHUB_REF_NAME}"
            echo "Commit          : ${GITHUB_SHA}"
            echo "Workflow run    : #${GITHUB_RUN_NUMBER}"
            echo ""
            echo "--------------------------------------------------------------"
            echo " Hunk yang gagal apply otomatis (.rej, sudah di-skip)"
            echo "--------------------------------------------------------------"
            if [ -s /tmp/release/rej_list.txt ]; then
              sed 's/^/  - /' /tmp/release/rej_list.txt
            else
              echo "  (tidak ada, semua hunk nempel bersih)"
            fi
            echo ""
            echo "--------------------------------------------------------------"
            echo " Fix manual otomatis yang dijalankan workflow"
            echo "--------------------------------------------------------------"
            echo "  - sound/usb/card.h        : field stream_offset_adj"
            echo "  - drivers/spi/spi-mt65xx.c: reg_val = 0 & macro SPI_ADJUST_CFG0_SCK_LOW_OFFSET"
            echo "  - drivers/usb/host/xhci-mtk.c: dedup pm_runtime_put_noidle/disable"
            echo "  - lib/random32.c          : net_rand_state non-static"
            echo "  - mm/memory.c             : cow_user_page signature baru"
            echo "  - include/linux/overflow.h: dedup helper"
            echo "  - drivers/hid/hid-core.c  : dedup hid_compute_report_size"
            echo "  - include/linux/khugepaged.h & mm/page_alloc.c: include + fallback khugepaged"
            echo ""
            echo "--------------------------------------------------------------"
            echo " Daftar commit upstream (linux-stable ChangeLog)"
            echo "--------------------------------------------------------------"
          } > "$CL"

          for n in $(seq $((CURRENT + 1)) "$TARGET"); do
            URL="https://cdn.kernel.org/pub/linux/kernel/v4.x/ChangeLog-4.14.${n}"
            {
              echo ""
              echo "### Linux 4.14.${n}"
            } >> "$CL"
            if curl -fsSL --retry 3 --retry-delay 5 "$URL" -o "/tmp/cl_${n}.txt"; then
              awk '/^commit [0-9a-f]+/ {s=1; next} s==1 && /^$/ {s=2; next} s==2 {sub(/^    /, ""); print "  - " $0; s=0}' "/tmp/cl_${n}.txt" >> "$CL"
            else
              echo "  (ChangeLog-4.14.${n} gagal diunduh dari kernel.org)" >> "$CL"
            fi
          done

          echo ""
          echo "Ringkasan changelog:"
          wc -l "$CL"

          ZIP_NAME="RooXie-v4.14.${TARGET}-${OC_STEP}-run${GITHUB_RUN_NUMBER}.zip"
          cp out/arch/arm/boot/boot.img-kernel /tmp/release/boot.img-kernel
          (cd /tmp/release && zip -j "$ZIP_NAME" boot.img-kernel "$(basename "$CL")")
          ls -l "/tmp/release/$ZIP_NAME"

          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

          {
            echo "Kernel Samsung A022F - upstream 4.14.${CURRENT} -> 4.14.${TARGET}"
            echo ""
            echo "- Preset OC: ${OC_STEP}"
            echo "- Isi zip: boot.img-kernel + changelog upstream (txt)"
            echo "- Build: workflow run #${GITHUB_RUN_NUMBER}"
          } > /tmp/release/notes.md

      - name: Commit & Push Permanen ke branch
        run: |
          # Cuma sampai sini kalau "Build Kernel" di atas sukses.
          rm -f drivers/misc/mediatek/base/power/cpufreq_v2/src/mach/mt6739/mtk_cpufreq_opp_table.h.bak
          rm -f upgrade.patch

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A -- . ':(exclude)out' ':(exclude)build.log'

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan untuk di-push."
          else
            git commit -m "Auto-build: naik ke SUBLEVEL ${{ steps.ver.outputs.target }} + OC ${{ github.event.inputs.oc_step }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload Kernel (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: RooXie-v${{ steps.ver.outputs.target }}-${{ github.event.inputs.oc_step }}
          path: |
            out/arch/arm/boot/boot.img-kernel
            /tmp/release/${{ env.ZIP_NAME }}

      - name: Publish ke GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ steps.ver.outputs.target }}
          OC_STEP: ${{ github.event.inputs.oc_step }}
        run: |
          TAG="v4.14.${TARGET}-${OC_STEP}-r${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" "/tmp/release/${ZIP_NAME}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title "RooXie 4.14.${TARGET} - ${OC_STEP} (run #${GITHUB_RUN_NUMBER})" \
            --notes-file /tmp/release/notes.md
