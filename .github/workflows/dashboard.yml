name: Upstream Kernel Dashboard
on:
  workflow_dispatch:
    inputs:
      target_sub:
        description: 'Mau naik ke Sublevel berapa? (Contoh: 187, 188, 190)'
        required: true
        default: '187'

jobs:
  upstream_job:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev gcc-arm-linux-gnueabi

      - name: Apply Upstream Patch
        run: |
          # 1. Ambil info versi
          CURRENT_SUB=$(grep "^SUBLEVEL =" Makefile | awk '{print $3}')
          TARGET_SUB=${{ github.event.inputs.target_sub }}
          
          echo "Versi saat ini: 4.14.$CURRENT_SUB"
          echo "Target upgrade: 4.14.$TARGET_SUB"
          
          if [ "$CURRENT_SUB" -eq "$TARGET_SUB" ]; then
            echo "Versi sudah sama. Skip patching."
          else
            # 2. Ambil Patch dari Kernel.org sesuai input
            echo "Mengambil patch v4.14.$TARGET_SUB..."
            wget https://mirrors.edge.kernel.org/pub/linux/kernel/v4.x/patch-4.14.$TARGET_SUB.gz
            gunzip patch-4.14.$TARGET_SUB.gz

            # 3. Eksekusi Patching
            patch -p1 --forward < patch-4.14.$TARGET_SUB || echo "Ada minor conflict, lanjut build..."
          fi

      # STEP JAMU DIHAPUS SEPERTI REQUEST LU
      # Sekarang dia bakal pakai file SPI yang lu upload manual tadi.

      - name: Commit and Push
        run: |
          git config --global user.name "RooXie-Bot"
          git config --global user.email "bot@github.com"
          
          # Pakai variabel input di pesan commit
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Upstream: Linux v4.14.${{ github.event.inputs.target_sub }}"
            git push origin master
          else
            echo "Gak ada perubahan yang perlu di-push."
          fi

      - name: Build Test
        run: |
          # set -e supaya kalau error pas compile, Actions langsung MERAH
          set -e
          chmod +x z
          ./z

      - name: Upload zImage
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-v4.14.${{ github.event.inputs.target_sub }}-Test
          path: "**/arch/arm/boot/zImage"
