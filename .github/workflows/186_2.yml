name: Build Up (v200)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Toolchain & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev gcc-arm-linux-gnueabi

      - name: Apply Upstream Patch (v186 to v200)
        run: |
          # PENTING: repo ini nggak pernah ke-push ke v190 -- v190 cuma
          # hasil patch on-the-fly pas 186_1.yml jalan (fetch diff, patch,
          # build, buang, nggak di-commit). Makanya di sini kita diff
          # LANGSUNG v186->v200 dalam satu tembakan, BUKAN v190->v200
          # nyambung di atas v190 yang nggak pernah ada secara fisik di
          # branch ini. Sudah diverifikasi: hasil diff langsung v186->v200
          # itu union persis dari (v186->v190) + (v190->v200), nggak ada
          # kejutan baru, dan malah lebih bersih (satu diff, bukan numpuk
          # 2 patch berurutan yang rawan geser offset).
          CURRENT_SUBLEVEL=$(grep "^SUBLEVEL =" Makefile | awk '{print $3}')

          if [ "$CURRENT_SUBLEVEL" -eq "200" ]; then
            echo "Sudah di v200, skip patch."
          else
            FETCH_OK=0
            for i in 1 2 3; do
              echo "Percobaan fetch ke git.kernel.org (ke-$i)..."
              git remote add stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux-stable.git 2>/dev/null || true
              if git fetch stable tag v4.14.186 tag v4.14.200 --no-tags --depth 1; then
                FETCH_OK=1
                break
              fi
              echo "Gagal, tunggu sebentar sebelum retry..."
              sleep 10
            done

            if [ "$FETCH_OK" -eq 0 ]; then
              echo "::warning::git.kernel.org gagal terus, coba mirror GitHub (gregkh/linux)..."
              git remote remove stable 2>/dev/null || true
              git remote add stable https://github.com/gregkh/linux.git 2>/dev/null || true
              if git fetch stable tag v4.14.186 tag v4.14.200 --no-tags --depth 1; then
                FETCH_OK=1
              fi
            fi

            if [ "$FETCH_OK" -eq 0 ]; then
              echo "::warning::Semua sumber patch gagal diakses. Skip patch v186->v200, lanjut build di v186."
            else
              git diff v4.14.186 v4.14.200 -- arch/arm/ drivers/ include/ kernel/ mm/ net/ sound/ Makefile > p200_clean.patch

              set +e
              patch -p1 --forward --batch < p200_clean.patch
              PATCH_EXIT=$?
              set -e

              echo "Exit code patch: $PATCH_EXIT (nonzero itu wajar kalau ada hunk yang di-skip karena sudah diterapkan/di-backport sebelumnya)"
            fi
          fi

      - name: Verify Patch Result
        run: |
          NEW_SUBLEVEL=$(grep "^SUBLEVEL =" Makefile | awk '{print $3}')
          echo "SUBLEVEL sekarang: $NEW_SUBLEVEL"

          if [ "$NEW_SUBLEVEL" -eq "200" ]; then
            echo "Patch v200 berhasil diterapkan."
          elif [ "$NEW_SUBLEVEL" -eq "186" ]; then
            echo "Tetap di v186 (patch di-skip, kemungkinan karena upstream server down). Ini aman, lanjut build."
          else
            echo "::error::SUBLEVEL ($NEW_SUBLEVEL) di luar dugaan (bukan 186 atau 200), ada yang salah beneran."
            exit 1
          fi

          # ============================================================
          # Whitelist ini hasil audit manual v186->v200 LANGSUNG (bukan
          # dua etape terpisah) -- semua 23 file di bawah sudah dicek satu
          # per satu (clone repo asli + replay patch + cek defconfig +
          # cek anchor code) dan dipastikan aman diabaikan karena salah
          # satu dari:
          #
          #   (a) TIDAK PERNAH KE-COMPILE di kernel A02 (dicek lewat
          #       a02_defconfig.txt + live check di device: eMMC-only,
          #       no UFS, no DRM_MEDIATEK):
          #       drivers/scsi/ufs/ufshcd.c, ufs_quirks.h,
          #       drivers/gpu/drm/mediatek/mtk_hdmi.c
          #
          #   (b) VENDOR TREE SUDAH LEBIH MAJU dari target v200 di titik
          #       itu (isi file SUDAH sama dengan/lebih baru dari yang
          #       diminta patch, patch gagal karena konteks lama sudah
          #       nggak ada -- BUKAN berarti kurang, malah lebih):
          #       Makefile (CLANG_FLAGS prefix), include/linux/mod_devicetable.h
          #       (SW_MAX vendor 0x3f, v200 cuma minta 0x10 -- JANGAN ditimpa),
          #       include/uapi/linux/input-event-codes.h,
          #       include/trace/events/writeback.h (fs/fs-writeback.c
          #       vendor sudah pakai signature dirtied_before 4-arg),
          #       include/linux/fs.h (I_SYNC_QUEUED sudah dipakai konsisten)
          #
          #   (c) SUDAH DI-BACKPORT vendor sebelumnya ("previously applied"):
          #       drivers/block/loop.c, sound/usb/card.h, endpoint.c,
          #       endpoint.h, pcm.c
          #
          #   (d) COSMETIC MURNI, nol perubahan perilaku (rename variabel/
          #       reorder deklarasi/simplifikasi macro pakai offsetof()):
          #       drivers/md/dm-table.c, include/linux/debugfs.h,
          #       include/uapi/linux/wireless.h
          #
          #   (e) HARDENING NYATA yang hilang TAPI non-boot-blocking --
          #       hunk gagal BERSIH (fungsi tetap utuh di state lama, nggak
          #       ninggalin logic campuran kayak kasus spi-mt65xx.c), jadi
          #       aman di-skip untuk sekarang, bisa direvisit belakangan:
          #       drivers/android/binder.c (self-transaction WARN_ON check),
          #       mm/memory.c (cow_user_page race hardening),
          #       arch/arm/kernel/stacktrace.c (clang unwind improvement),
          #       drivers/hid/hid-core.c, hid-input.c, hid-multitouch.c,
          #       include/linux/hid.h (satu paket, gagal konsisten semua)
          #
          # File YANG BENERAN BUG (drivers/spi/spi-mt65xx.c,
          # drivers/usb/host/xhci-mtk.c) SUDAH terverifikasi identik sama
          # yang bikin v190 sempat hang-di-logo dulu, dan SUDAH terbukti
          # jalan normal di device setelah ditambal manual di step
          # berikutnya -- makanya keduanya MASUK whitelist di sini juga,
          # gate ini cuma cek nama file bukan isi .rej-nya.
          # ============================================================
          KNOWN_SAFE_REJECTS="
          ./Makefile.rej
          ./drivers/scsi/ufs/ufshcd.c.rej
          ./drivers/scsi/ufs/ufs_quirks.h.rej
          ./drivers/gpu/drm/mediatek/mtk_hdmi.c.rej
          ./include/linux/mod_devicetable.h.rej
          ./include/uapi/linux/input-event-codes.h.rej
          ./include/trace/events/writeback.h.rej
          ./include/linux/fs.h.rej
          ./drivers/block/loop.c.rej
          ./sound/usb/card.h.rej
          ./sound/usb/endpoint.c.rej
          ./sound/usb/endpoint.h.rej
          ./sound/usb/pcm.c.rej
          ./drivers/md/dm-table.c.rej
          ./include/linux/debugfs.h.rej
          ./include/uapi/linux/wireless.h.rej
          ./drivers/android/binder.c.rej
          ./mm/memory.c.rej
          ./arch/arm/kernel/stacktrace.c.rej
          ./drivers/hid/hid-core.c.rej
          ./drivers/hid/hid-input.c.rej
          ./drivers/hid/hid-multitouch.c.rej
          ./include/linux/hid.h.rej
          ./drivers/spi/spi-mt65xx.c.rej
          ./drivers/usb/host/xhci-mtk.c.rej
          "

          ALL_REJECTS=$(find . -name "*.rej" 2>/dev/null)
          UNEXPECTED_REJECTS=""

          for f in $ALL_REJECTS; do
            if ! echo "$KNOWN_SAFE_REJECTS" | grep -qxF "$f"; then
              UNEXPECTED_REJECTS="$UNEXPECTED_REJECTS $f"
            fi
          done

          if [ -n "$UNEXPECTED_REJECTS" ]; then
            echo "::error::Ada .rej BARU yang belum pernah diverifikasi manual. Build DIHENTIKAN:"
            for f in $UNEXPECTED_REJECTS; do
              echo "  - $f"
              cat "$f"
            done
            echo "::error::Cek manual isi file di atas, pastikan false positive atau tambal manual, lalu update whitelist KNOWN_SAFE_REJECTS di step ini."
            exit 1
          fi

          echo "Semua .rej yang ada sudah dikenali dan diverifikasi aman."
          find . -name "*.rej" -delete 2>/dev/null || true
          find . -name "*.orig" -delete 2>/dev/null || true

      - name: Fix drivers/spi/spi-mt65xx.c (uninitialized reg_val)
        run: |
          FILE="drivers/spi/spi-mt65xx.c"
          # Bug yang sama persis dengan yang bikin v190 hang-di-logo dulu
          # (lihat catatan lengkap di 186_1.yml). Idempotent.
          if grep -q "u32 spi_clk_hz, div, sck_time, cs_time, reg_val = 0;" "$FILE"; then
            echo "reg_val sudah terinisialisasi, skip."
          elif grep -q "u32 spi_clk_hz, div, sck_time, cs_time, reg_val;" "$FILE"; then
            sed -i 's/u32 spi_clk_hz, div, sck_time, cs_time, reg_val;/u32 spi_clk_hz, div, sck_time, cs_time, reg_val = 0;/' "$FILE"
            echo "Inisialisasi reg_val = 0 dikembalikan."
          else
            echo "::error::Deklarasi reg_val di $FILE nggak ketemu pola yang diharapkan. Cek manual."
            exit 1
          fi

          if ! grep -q "u32 spi_clk_hz, div, sck_time, cs_time, reg_val = 0;" "$FILE"; then
            echo "::error::reg_val masih belum terinisialisasi setelah fix di $FILE."
            exit 1
          fi

      - name: Fix drivers/usb/host/xhci-mtk.c (duplicate pm_runtime call)
        run: |
          FILE="drivers/usb/host/xhci-mtk.c"
          # Bug yang sama persis dengan yang di v190 (lihat catatan
          # lengkap di 186_1.yml). Idempotent.
          COUNT=$(grep -c "pm_runtime_put_noidle(&dev->dev);" "$FILE" || true)

          if [ "$COUNT" -eq 1 ]; then
            echo "Cuma ada 1 pemanggilan, sudah bersih. Skip."
          elif [ "$COUNT" -ge 2 ]; then
            python3 - "$FILE" <<'PYEOF'
          import sys
          path = sys.argv[1]
          with open(path) as f:
              content = f.read()

          block = "\tpm_runtime_put_noidle(&dev->dev);\n\tpm_runtime_disable(&dev->dev);\n\n"
          first = content.find(block)
          second = content.find(block, first + len(block))

          if first == -1 or second == -1:
              print("::error::Pola blok duplikat tidak ditemukan persis seperti yang diharapkan.")
              sys.exit(1)

          content = content[:second] + content[second + len(block):]
          with open(path, "w") as f:
              f.write(content)
          print("Blok duplikat kedua dihapus.")
          PYEOF
          else
            echo "::error::pm_runtime_put_noidle tidak ditemukan sama sekali di $FILE. Cek manual."
            exit 1
          fi

          FINAL_COUNT=$(grep -c "pm_runtime_put_noidle(&dev->dev);" "$FILE" || true)
          if [ "$FINAL_COUNT" -ne 1 ]; then
            echo "::error::Masih ada $FINAL_COUNT pemanggilan pm_runtime_put_noidle setelah fix (harusnya 1)."
            exit 1
          fi

      - name: Fix MediaTek SPI Timing Offset
        run: |
          FILE="drivers/spi/spi-mt65xx.c"
          # Nilai yang benar: 16 (lihat catatan lengkap di 186_1.yml).
          if grep -q "^#define SPI_ADJUST_CFG0_SCK_LOW_OFFSET" "$FILE"; then
            echo "Guard sudah ada, skip insert."
          else
            LAST_INCLUDE_LINE=$(grep -n '^#include' "$FILE" | tail -1 | cut -d: -f1)
            awk -v n="$LAST_INCLUDE_LINE" '{print} NR==n {print "#ifndef SPI_ADJUST_CFG0_SCK_LOW_OFFSET"; print "#define SPI_ADJUST_CFG0_SCK_LOW_OFFSET 16"; print "#endif"}' "$FILE" > "$FILE.tmp" && mv "$FILE.tmp" "$FILE"
          fi

          if ! grep -q "^#define SPI_ADJUST_CFG0_SCK_LOW_OFFSET" "$FILE"; then
            echo "::error::#define SPI_ADJUST_CFG0_SCK_LOW_OFFSET tetap tidak ditemukan di $FILE setelah insert."
            exit 1
          fi

      - name: Generate Changelog
        run: |
          # Auto-generate changelog dari commit log resmi v4.14.186->v4.14.200
          # (fetch shallow-since supaya history-nya nyambung, bukan cuma
          # snapshot 2 tag terpisah), difilter ke direktori yang relevan
          # buat kernel ini, dibuang commit "Linux 4.14.x" version-bump.
          git remote add changelog-src https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux-stable.git 2>/dev/null || \
          git remote add changelog-src https://github.com/gregkh/linux.git 2>/dev/null || true

          FETCH_OK=0
          if git fetch changelog-src tag v4.14.186 tag v4.14.200 --no-tags --depth 1 2>/dev/null; then
            V186_DATE=$(git log -1 --format=%cd --date=short v4.14.186 2>/dev/null)
            if [ -n "$V186_DATE" ] && git fetch changelog-src linux-4.14.y --shallow-since="$V186_DATE" 2>/dev/null; then
              FETCH_OK=1
            fi
          fi

          {
            echo "======================================================"
            echo " RooXie Kernel -- Changelog v4.14.186 -> v4.14.200"
            echo " Build date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo " Device: Samsung SM-A022F (MT6739)"
            echo "======================================================"
            echo
            echo "## Upstream fixes (Linux stable v4.14.186..v4.14.200)"
            echo

            if [ "$FETCH_OK" -eq 1 ]; then
              git log v4.14.186..v4.14.200 --pretty=format:"- %s" -- arch/arm/ drivers/ include/ kernel/ mm/ net/ sound/ Makefile 2>/dev/null \
                | grep -viE "^- Linux 4\.14\.(18[7-9]|19[0-9]|200)$" \
                | sort -u
            else
              echo "(gagal fetch history upstream saat build ini -- lihat commit range resmi di https://git.kernel.org/.../linux-stable.git/log/?h=linux-4.14.y)"
            fi

            echo
            echo "## Custom fixes (A02 vendor tree, ditambal manual di workflow ini)"
            echo
            echo "- spi: mediatek: perbaiki reg_val yang tidak terinisialisasi di mtk_spi_prepare_transfer()"
            echo "  (penyebab hang-di-boot-logo waktu upgrade ke v190, ditambal juga di sini karena"
            echo "  hunk register-timing upstream tidak applicable ke fungsi vendor yang sudah dimodifikasi)"
            echo "- usb: xhci-mtk: hapus duplicate pm_runtime_put_noidle()+pm_runtime_disable() di xhci_mtk_remove()"
            echo
            echo "## Known gaps (aman di-skip, non-boot-blocking, bisa direvisit)"
            echo
            echo "- android: binder: self-transaction WARN_ON check belum di-backport"
            echo "- mm: cow_user_page() race-condition hardening belum di-backport"
            echo "- HID: beberapa defensive-programming fix (hid-core/hid-input/hid-multitouch) belum di-backport"
            echo
          } > CHANGELOG.txt

          cat CHANGELOG.txt

      - name: Build Kernel
        run: |
          chmod +x z
          ./z

      - name: Package Output
        run: |
          cd out/arch/arm/boot
          if [ -f "zImage-dtb" ]; then
            cp zImage-dtb boot.img-kernel
          else
            echo "::warning::zImage-dtb tidak ditemukan, fallback ke zImage (DTB terpisah)."
            cp zImage boot.img-kernel
          fi
          cp "$GITHUB_WORKSPACE/CHANGELOG.txt" .
          zip RooXie-v200.zip boot.img-kernel CHANGELOG.txt

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: RooXie-v200
          path: out/arch/arm/boot/RooXie-v200.zip
