name: A02 OC Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 186

      - name: Apply Patch
        run: |
          python3 -c "exec(\"from pathlib import Path\nimport glob\nfiles=glob.glob('arch/arm/boot/dts/**/*.dts',recursive=True)\ninjected=False\nfor f in files:\n p=Path(f)\n try:\n  d=p.read_text(errors='ignore')\n except:\n  continue\n if 'opp-1495000' in d:\n  i='\\n\\topp-1550000 {\\n\\t\\topp-hz = /bits/ 64 <1550000000>;\\n\\t\\topp-microvolt = <925000>;\\n\\t};\\n\\n\\topp-1600000 {\\n\\t\\topp-hz = /bits/ 64 <1600000000>;\\n\\t\\topp-microvolt = <950000>;\\n\\t};\\n'\n  d=d.replace('opp-1495000 {','opp-1495000 {'+i,1)\n  p.write_text(d)\n  print('[+] Injected REAL OC OPP into',f)\n  injected=True\n  break\nprint('[+] REAL OC DTS patch done' if injected else '[-] OPP table not found - patch failed')\")"

      # ======================================
      # BUILD
      # ======================================
      - name: Start Building
        run: |
          chmod +x z
          ./z
          mkdir -p outz
          find . -name "zImage" -exec cp {} outz/zImage \;

      # ======================================
      # RELEASE (zImage ONLY)
      # ======================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: a02-real-oc-1550-1600mhz-${{ github.run_number }}
          name: "Samsung A02 REAL OC Kernel 1550/1600MHz (branch 186)"
          files: outz/zImage
