name: Manual Kernel Build - A02 1550MHz Gov Integrated

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        ref: 186

    - name: Install deps
      run: |
        sudo apt update
        sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
        git gnupg gperf libncurses5-dev libssl-dev libxml2-utils lzop unzip zip zlib1g-dev \
        python3 python3-pip

    # =========================
    # KERNEL-INTEGRATED PATCH
    # =========================
    - name: Apply Kernel Governor System Patch
      run: |
        echo "Applying governor integrated system..."

        # Insert gov_mode param
        sed -i '/#include <linux\/cpufreq.h>/a \
        static char gov_mode[16] = "balanced";\n\
        static int __init gov_mode_setup(char *str){ if(str) strlcpy(gov_mode,str,sizeof(gov_mode)); return 1; }\n\
        __setup("gov_mode=", gov_mode_setup);\n' drivers/cpufreq/cpufreq.c

        # Insert OC freq clamp
        sed -i '/struct cpufreq_policy \*policy/a \
        #define MAX_OC_FREQ 1550000\n\
        if (policy->max > MAX_OC_FREQ)\n\
        policy->max = MAX_OC_FREQ;\n' drivers/cpufreq/cpufreq.c

        echo "Kernel governor system patched."

    # =========================
    # BUILD
    # =========================
    - name: Fix script permission
      run: chmod +x z

    - name: Build kernel
      run: ./z

    # =========================
    # OUTPUT
    # =========================
    - name: Collect output
      run: |
        mkdir -p out
        find . -name "zImage" -exec cp {} out/ \; || true
        find . -name "Image" -exec cp {} out/ \; || true
        find . -name "*.dtb" -exec cp {} out/ \; || true
        find . -name "*.dtbo" -exec cp {} out/ \; || true

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: a02-kernel-1550mhz-gov-integrated
        path: out/
