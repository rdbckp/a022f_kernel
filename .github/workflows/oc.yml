name: A02 OC Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 186

      - name: Apply Patch
        run: |
          python3 -c "from pathlib import Path; import glob; files=glob.glob('arch/arm/boot/dts/**/*.dts', recursive=True); injected=False; \
          i='\\n\\topp-1550000 {\\n\\t\\topp-hz = /bits/ 64 <1550000000>;\\n\\t\\topp-microvolt = <925000>;\\n\\t};\\n\\n\\topp-1600000 {\\n\\t\\topp-hz = /bits/ 64 <1600000000>;\\n\\t\\topp-microvolt = <950000>;\\n\\t};\\n'; \
          [ (lambda p: (p.write_text(p.read_text(errors='ignore').replace('opp-1495000 {','opp-1495000 {'+i,1)), print('[+] Injected REAL OC OPP into', p), True)[2] if 'opp-1495000' in p.read_text(errors='ignore') and not injected else False)(Path(f)) or (injected:=True) for f in files if not injected ]; \
          print('[+] REAL OC DTS patch done' if injected else '[-] OPP table not found - patch failed')"

      # ======================================
      # BUILD
      # ======================================
      - name: Start Building
        run: |
          chmod +x z
          ./z
          mkdir -p outz
          find . -name "zImage" -exec cp {} outz/zImage \;

      # ======================================
      # RELEASE (zImage ONLY)
      # ======================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: a02-real-oc-1550-1600mhz-${{ github.run_number }}
          name: "Samsung A02 REAL OC Kernel 1550/1600MHz (branch 186)"
          files: outz/zImage
