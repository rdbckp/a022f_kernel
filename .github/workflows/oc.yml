name: A02 Kernel OC 1550MHz

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (branch 186)
        uses: actions/checkout@v4
        with:
          ref: 186

      # ======================================
      # SAFE OC PATCH (1550 MHz)
      # ======================================
      - name: Apply OC patch (1550 MHz clamp)
        run: python3 -c "from pathlib import Path; f=Path('drivers/cpufreq/cpufreq.c'); d=f.read_text(); n='int cpufreq_generic_init(struct cpufreq_policy *policy,'; i='    /* OC CLAMP SYSTEM - SAFE DAILY OC */\\n    if (policy->max > 1550000)\\n        policy->max = 1550000;\\n\\n'; p=d.find(n); b=d.find('{',p); f.write_text(d[:b+1]+'\\n'+i+d[b+1:]); print('[+] OC patch injected')"

      # ======================================
      # PERMISSION
      # ======================================
      - name: Fix build script permission
        run: chmod +x z

      # ======================================
      # BUILD
      # ======================================
      - name: Build kernel (script z)
        run: ./z

      # ======================================
      # COLLECT zImage ONLY
      # ======================================
      - name: Collect zImage
        run: |
          mkdir -p out
          find . -name "zImage" -exec cp {} out/zImage \;

      # ======================================
      # RELEASE (zImage ONLY)
      # ======================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: a02-oc-1550mhz-${{ github.run_number }}
          name: "A02 OC Kernel 1550MHz (branch 186)"
          files: out/zImage
