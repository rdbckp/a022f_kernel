name: Build +1
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Toolchain & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev gcc-arm-linux-gnueabi

      - name: Apply Upstream Patch (v186 to v190)
        run: |
          CURRENT_SUBLEVEL=$(grep "^SUBLEVEL =" Makefile | awk '{print $3}')

          if [ "$CURRENT_SUBLEVEL" -eq "190" ]; then
            echo "Sudah di v190, skip patch."
          else
            git remote add stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux-stable.git || true
            git fetch stable tag v4.14.186 tag v4.14.190 --no-tags --depth 1
            git diff v4.14.186 v4.14.190 -- arch/arm/ drivers/ include/ kernel/ mm/ net/ sound/ Makefile > p190_clean.patch

            # PENTING: jangan hard-fail cuma karena exit code patch != 0.
            # Beberapa file (contoh: sound/usb/*) sering udah di-backport duluan
            # sama vendor tree Samsung, jadi patch bakal bilang "Reversed (or
            # previously applied) patch detected! Skipping patch." itu AMAN,
            # bukan error beneran. Makanya set +e di sini, exit code asli cuma
            # dicatat, keputusan pass/fail sebenernya ditentuin di step
            # "Verify Patch Result" lewat cek SUBLEVEL.
            set +e
            patch -p1 --forward --batch < p190_clean.patch
            PATCH_EXIT=$?
            set -e

            echo "Exit code patch: $PATCH_EXIT (nonzero itu wajar kalau ada hunk yang di-skip karena sudah diterapkan sebelumnya)"

            REJECTS=$(find . -name "*.rej" 2>/dev/null)
            if [ -n "$REJECTS" ]; then
              echo "::warning::Ada hunk yang di-reject (biasanya karena sudah ada di source, cek manual kalau ragu):"
              echo "$REJECTS"
            fi
          fi

      - name: Verify Patch Result
        run: |
          NEW_SUBLEVEL=$(grep "^SUBLEVEL =" Makefile | awk '{print $3}')
          echo "SUBLEVEL sekarang: $NEW_SUBLEVEL"

          # Ini gate sebenarnya: kalau Makefile gagal ke-bump ke 190, baru
          # dianggap patch beneran gagal. Reject di file lain (sound/usb dkk)
          # sudah di-warn di step sebelumnya dan nggak menghentikan build.
          if [ "$NEW_SUBLEVEL" -ne "190" ]; then
            echo "::error::SUBLEVEL bukan 190 setelah patch, ada yang salah beneran."
            exit 1
          fi

          echo "SUBLEVEL sudah 190, aman lanjut build."
          # Beres-beres sisa .rej biar nggak numpuk di source tree
          find . -name "*.rej" -delete 2>/dev/null || true

      - name: Fix MediaTek SPI Header (The Dirty Way)
        run: |
          FILE="drivers/spi/spi-mt65xx.c"

          # Cek dulu biar idempotent, jangan sampai double-insert kalau workflow dijalanin ulang
          if grep -q "SPI_ADJUST_CFG0_SCK_LOW_OFFSET" "$FILE"; then
            echo "Guard sudah ada, skip insert."
          else
            # Anchor ke #include terakhir, bukan nomor baris statis (nomor baris gampang geser abis patch)
            LAST_INCLUDE_LINE=$(grep -n '^#include' "$FILE" | tail -1 | cut -d: -f1)
            awk -v n="$LAST_INCLUDE_LINE" '{print} NR==n {print "#ifndef SPI_ADJUST_CFG0_SCK_LOW_OFFSET"; print "#define SPI_ADJUST_CFG0_SCK_LOW_OFFSET 0"; print "#endif"}' "$FILE" > "$FILE.tmp" && mv "$FILE.tmp" "$FILE"
          fi

          echo "--- Preview hasil insert ---"
          grep -n -A3 -B3 "SPI_ADJUST_CFG0_SCK_LOW_OFFSET" "$FILE"

      - name: Build Kernel
        run: |
          chmod +x z
          ./z

      - name: Upload zImage
        uses: actions/upload-artifact@v4
        with:
          name: RooXie-v190
          path: out/arch/arm/boot/zImage
          
