name: Cleaning workflow runs is done!

on:
  workflow_dispatch:

jobs:
  start-working:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Permission
      run: |
        cd ${GITHUB_WORKSPACE}
        chmod +x -R scriptsgw
        
    - name: Delete
      uses: ./
      with:
        keep: 1
