name: Find CPU Freq Driver and OPP Tables

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to checkout'
        required: true
        default: '186-master'

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 1

      - name: Run search commands and log results
        run: |
          mkdir -p /tmp/result
          REPORT=/tmp/result/report.txt

          echo "########## 1. find *cpufreq* files ##########" | tee -a "$REPORT"
          find . -iname "*cpufreq*" -not -path "*/node_modules/*" 2>/dev/null | tee -a "$REPORT"

          echo "" | tee -a "$REPORT"
          echo "########## 2. dts/dtsi containing operating-points / opp-table ##########" | tee -a "$REPORT"
          grep -rln "operating-points\|opp-table\|opp-microvolt" arch/arm/boot/dts/ arch/arm64/boot/dts/mediatek/ 2>/dev/null | tee -a "$REPORT"

          echo "" | tee -a "$REPORT"
          echo "########## 3. MTK DVFS / cpufreq keyword hits in drivers/ ##########" | tee -a "$REPORT"
          grep -rln "MCUCFG\|MT_CPU_DVFS\|cpufreq_opp\|dvfs_default_freq" drivers/ 2>/dev/null | tee -a "$REPORT"

          echo "" | tee -a "$REPORT"
          echo "########## 4. bonus: any file/dir with 'dvfs' in the name ##########" | tee -a "$REPORT"
          find . -iname "*dvfs*" -not -path "*/node_modules/*" 2>/dev/null | tee -a "$REPORT"

          echo "" | tee -a "$REPORT"
          echo "########## 5. bonus: mtk power/thermal driver folders ##########" | tee -a "$REPORT"
          find . -type d -iname "*power*" -path "*mediatek*" 2>/dev/null | tee -a "$REPORT"
          find . -type d -iname "*thermal*" -path "*mediatek*" 2>/dev/null | tee -a "$REPORT"

          echo "" | tee -a "$REPORT"
          echo "########## Report done ##########" | tee -a "$REPORT"

      - name: Copy every file found into bundle (best-effort)
        run: |
          mkdir -p /tmp/bundle
          cp /tmp/result/report.txt /tmp/bundle/

          # re-run each find/grep and actually copy the matched files (not just log paths)
          collect() {
            while IFS= read -r f; do
              [ -f "$f" ] || continue
              mkdir -p "/tmp/bundle/$(dirname "$f")"
              cp "$f" "/tmp/bundle/$f"
            done
          }

          find . -iname "*cpufreq*" -not -path "*/node_modules/*" 2>/dev/null | collect
          grep -rln "operating-points\|opp-table\|opp-microvolt" arch/arm/boot/dts/ arch/arm64/boot/dts/mediatek/ 2>/dev/null | collect
          grep -rln "MCUCFG\|MT_CPU_DVFS\|cpufreq_opp\|dvfs_default_freq" drivers/ 2>/dev/null | collect
          find . -iname "*dvfs*" -not -path "*/node_modules/*" 2>/dev/null | collect

      - name: Zip everything
        run: |
          cd /tmp/bundle
          zip -r /tmp/cpufreq-search-results.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpufreq-search-results
          path: /tmp/cpufreq-search-results.zip
          retention-days: 7
          
