name: Fetch CPUFreq Config Files (Read-Only)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to checkout'
        required: true
        default: '186-master'

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel repo (read-only, nothing pushed back)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 1

      - name: Bundle target files
        run: |
          mkdir -p /tmp/bundle
          SRC=drivers/misc/mediatek/base/power/cpufreq_v2/src/mach/mt6739
          mkdir -p "/tmp/bundle/$SRC"
          cp "$SRC/mtk_cpufreq_config.h" "/tmp/bundle/$SRC/" 2>/dev/null || echo "config.h not found at expected path" > /tmp/bundle/CONFIG_H_MISSING.txt
          cp "$SRC/mtk_cpufreq_platform.c" "/tmp/bundle/$SRC/" 2>/dev/null || echo "platform.c not found at expected path" > /tmp/bundle/PLATFORM_C_MISSING.txt
          cp "$SRC/mtk_cpufreq_opp_table.h" "/tmp/bundle/$SRC/" 2>/dev/null
          cp "$SRC/mtk_cpufreq_debug.h" "/tmp/bundle/$SRC/" 2>/dev/null

      - name: Zip
        run: cd /tmp/bundle && zip -r /tmp/cpufreq-config-files.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpufreq-config-files
          path: /tmp/cpufreq-config-files.zip
          retention-days: 7
          
