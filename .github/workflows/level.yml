name: Upstream to 187 Only
on:
  workflow_dispatch:

jobs:
  upstream_job:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev gcc-arm-linux-gnueabi

      - name: Apply Patch 187
        run: |
          # 1. Cek versi sekarang
          CURRENT_SUB=$(grep "^SUBLEVEL =" Makefile | awk '{print $3}')
          echo "Versi saat ini: 4.14.$CURRENT_SUB"
          
          if [ "$CURRENT_SUB" -ge 187 ]; then
            echo "Repo lu udah di 187 atau lebih tinggi. Gak perlu patch lagi!"
            exit 0
          fi

          # 2. Ambil Patch dari Kernel.org
          echo "Mengambil patch v4.14.187..."
          wget https://mirrors.edge.kernel.org/pub/linux/kernel/v4.x/patch-4.14.187.gz
          gunzip patch-4.14.187.gz

          # 3. Eksekusi Patching
          # Kita pakai --dry-run dulu buat simulasi, baru real patch
          patch -p1 --forward < patch-4.14.187 || echo "Ada konflik minor, bakal dicek manual."

      - name: Jamu Sakti (MediaTek Fix)
        run: |
          # 1. Masuk ke folder driver
          FILE="drivers/spi/spi-mt65xx.c"
          
          # 2. Hapus semua baris jamu lama (baris 35 sampai 50 kita bersihin biar gak tumpang tindih)
          # Kita hapus baris yang mengandung keyword spesifik jamu kita
          sed -i '/SPI_ADJUST_CFG0_SCK_LOW_OFFSET/d' $FILE
          sed -i '/#ifndef SPI_ADJUST/d' $FILE
          sed -i '/#define SPI_ADJUST/d' $FILE
          
          # 3. Hapus #endif liar yang mungkin nyisa (ini biang kerok error lu)
          # Kita pake trik: hapus baris kosong atau baris #endif yang gak jelas di area atas
          sed -i '40,45d' $FILE
          
          # 4. Pasang Jamu yang Rapi & Presisi di baris 40
          # Kita pake blok kode yang lengkap biar aman
          sed -i '40i #ifndef SPI_ADJUST_CFG0_SCK_LOW_OFFSET\n#define SPI_ADJUST_CFG0_SCK_LOW_OFFSET 0\n#endif' $FILE
          
          echo "Isi file setelah diobati:"
          sed -n '35,50p' $FILE

      - name: Commit and Push
        run: |
          git config --global user.name "RooXie-Bot"
          git config --global user.email "bot@github.com"
          
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Upstream: Linux v4.14.187"
            git push origin master
          else
            echo "Gak ada perubahan."
          fi

      - name: Build Test
        run: |
          set -e
          chmod +x z
          ./z

      - name: Upload zImage
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-v4.14.187-Test
          path: "**/arch/arm/boot/zImage"
