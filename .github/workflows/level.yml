name: Build & Auto-Upstream (Dashboard)
on:
  workflow_dispatch:
    inputs:
      target_sub:
        description: 'Mau naik ke Sublevel berapa? (Contoh: 195)'
        required: true
        default: '190'

env:
  # Mengambil angka dari input yang lu ketik nanti
  TARGET_SUBLEVEL: ${{ github.event.inputs.target_sub }}

jobs:
  build:
    runs-on: ubuntu-latest
    # Wajib ada biar bot bisa push hasil patch balik ke repo lu
    permissions:
      contents: write

    steps:
      - name: Checkout Source Kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Toolchain & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev gcc-arm-linux-gnueabi
      - name: Apply Upstream Patch
        run: |
          CURRENT_SUB=$(grep "^SUBLEVEL =" Makefile | awk '{print $3}')
          TARGET_SUB=${{ env.TARGET_SUBLEVEL }}
          
          if [ "$CURRENT_SUB" -eq "$TARGET_SUB" ]; then
            echo "Versi Makefile ($CURRENT_SUB) sudah sama dengan Target ($TARGET_SUB). Skip patching!"
          else
            echo "Upgrade dari v4.14.$CURRENT_SUB ke v4.14.$TARGET_SUB..."
            git remote add stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux-stable.git || true
            git fetch stable tag v4.14.$CURRENT_SUB tag v4.14.$TARGET_SUB --no-tags --depth 1
            
            # Membuat patch selisih antar versi
            git diff v4.14.$CURRENT_SUB v4.14.$TARGET_SUB -- arch/arm/ drivers/ include/ kernel/ mm/ net/ sound/ Makefile > upgrade.patch
            
            # Apply patch dengan mode ignore-fail agar tidak stop jika ada hunk minor yang skip
            patch -p1 --forward --batch < upgrade.patch || echo "Ada beberapa bagian yang diskip, tetap lanjut..."
          fi
      - name: Fix MediaTek SPI Header (Jamu Abadi)
        run: |
          # Supaya driver SPI MediaTek nggak rewel
          sed -i '40i #ifndef SPI_ADJUST_CFG0_SCK_LOW_OFFSET\n#define SPI_ADJUST_CFG0_SCK_LOW_OFFSET 0\n#endif' drivers/spi/spi-mt65xx.c
          head -n 45 drivers/spi/spi-mt65xx.c
      - name: Commit and Push Changes
        run: |
          git config --global user.name "RooXie-Bot"
          git config --global user.email "bot@github.com"
          
          # Cek apakah ada perubahan file (Makefile dkk)
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Kernel: Auto-Upstream to v4.14.${{ env.TARGET_SUBLEVEL }}"
            git push origin master
            echo "Berhasil update repo ke v4.14.${{ env.TARGET_SUBLEVEL }}!"
          else
            echo "Tidak ada perubahan kode yang perlu di-push."
          fi
      - name: Build Kernel
        run: |
          # Pastikan script build lu dieksekusi
          chmod +x z
          ./z
      - name: Upload zImage
        uses: actions/upload-artifact@v4
        with:
          name: _RooXie-v${{ env.TARGET_SUBLEVEL }}-
          path: "**/arch/arm/boot/zImage"
