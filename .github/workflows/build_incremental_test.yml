name: Build TEST ONLY

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      target_sublevel:
        description: 'Target SUBLEVEL 4.14.xxx (kosongin = auto naik 5 level dari SUBLEVEL sekarang)'
        type: string
        required: false
        default: ''
      oc_step:
        description: 'Tahap OC (freq+volt sepasang, nurutin kurva Takumi123w/kernel-a01c -- sama-sama MT6739)'
        type: choice
        required: true
        default: 'step2_1359mhz'
        options:
          - stock_no_oc
          - step1_1307mhz
          - step2_1359mhz
          - step3_1411mhz
          - step4_1476mhz
          - step5_1580mhz
          - step6_1684mhz
          - step7_1801mhz_MAX_A01C

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Kernel
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: true

      - name: Install Toolchain & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev gcc-arm-linux-gnueabi

      - name: Tentukan versi current & target
        id: ver
        run: |
          CURRENT_SUBLEVEL=$(grep "^SUBLEVEL =" Makefile | awk '{print $3}')
          echo "SUBLEVEL sekarang: $CURRENT_SUBLEVEL"

          INPUT_TARGET="${{ github.event.inputs.target_sublevel }}"
          if [ -n "$INPUT_TARGET" ]; then
            TARGET_SUBLEVEL="$INPUT_TARGET"
            echo "Target diisi manual: $TARGET_SUBLEVEL"
          else
            TARGET_SUBLEVEL=$((CURRENT_SUBLEVEL + 5))
            echo "Target auto (current+5): $TARGET_SUBLEVEL"
          fi

          if [ "$TARGET_SUBLEVEL" -le "$CURRENT_SUBLEVEL" ]; then
            echo "::error::Target ($TARGET_SUBLEVEL) harus lebih besar dari current ($CURRENT_SUBLEVEL)."
            exit 1
          fi

          echo "current=$CURRENT_SUBLEVEL" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET_SUBLEVEL" >> "$GITHUB_OUTPUT"

      - name: Apply Upstream Patch
        run: |
          CURRENT="${{ steps.ver.outputs.current }}"
          TARGET="${{ steps.ver.outputs.target }}"

          # git.kernel.org kadang kasih 502/503. Retry beberapa kali dulu,
          # kalau tetap gagal baru coba mirror GitHub sebagai cadangan.
          FETCH_OK=0
          for i in 1 2 3; do
            echo "Percobaan fetch ke git.kernel.org (ke-$i)..."
            git remote add stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux-stable.git 2>/dev/null || true
            if git fetch stable "tag" "v4.14.$CURRENT" "tag" "v4.14.$TARGET" --no-tags --depth 1; then
              FETCH_OK=1
              break
            fi
            echo "Gagal, tunggu sebentar sebelum retry..."
            sleep 10
          done

          if [ "$FETCH_OK" -eq 0 ]; then
            echo "::warning::git.kernel.org gagal terus, coba mirror GitHub (gregkh/linux)..."
            git remote remove stable 2>/dev/null || true
            git remote add stable https://github.com/gregkh/linux.git 2>/dev/null || true
            if git fetch stable "tag" "v4.14.$CURRENT" "tag" "v4.14.$TARGET" --no-tags --depth 1; then
              FETCH_OK=1
            fi
          fi

          if [ "$FETCH_OK" -eq 0 ]; then
            echo "::error::Tag v4.14.$CURRENT / v4.14.$TARGET nggak ketemu di git.kernel.org maupun mirror GitHub. Build dihentikan (nggak ada yang bisa di-upgrade)."
            exit 1
          fi

          git diff "v4.14.$CURRENT" "v4.14.$TARGET" -- arch/arm/ drivers/ include/ kernel/ mm/ net/ sound/ Makefile > upgrade.patch

          # Exit code patch != 0 itu WAJAR -- banyak file udah di-backport
          # duluan sama vendor tree. Kita nggak berhenti di sini; .rej yang
          # tersisa cuma di-log, bukan bikin build gagal (lihat step
          # berikutnya). Gerbang keberhasilan yang sebenarnya adalah: build
          # sukses + tes langsung di HP.
          set +e
          patch -p1 --forward --batch --fuzz=0 < upgrade.patch
          PATCH_EXIT=$?
          set -e
          echo "Exit code patch: $PATCH_EXIT"

      - name: Dedup Duplicate Definitions (efek offset patch vs vendor backport)
        run: |
          # git diff dihitung dari tag upstream bersih, tapi working tree kita
          # fork vendor yang beberapa fungsinya udah di-backport manual duluan.
          # Kadang context hunk tetap match persis (walau --fuzz=0) di lokasi lain
          # di file yang sama -> fungsi ke-declare dua kali -> clang error
          # "redefinition of ...". Contoh nyata: skb_mark_not_on_list/skb_list_del_init
          # (include/linux/skbuff.h), array_size/array3_size/__ab_c_size (include/linux/overflow.h).
          # Step ini scan SEMUA file yang kena patch, cari "static inline ... { ... }"
          # yang bodinya sama persis lebih dari sekali dalam satu file, sisain yang pertama.
          perl -e '
            use strict; use warnings;
            open(my $pf, "<", "upgrade.patch") or die $!;
            my @files;
            while (<$pf>) {
              if (/^\+\+\+ b\/(\S+)/) {
                my $p = $1;
                push @files, $p if $p =~ /\.(c|h)$/;
              }
            }
            close $pf;
            my %seen; @files = grep { !$seen{$_}++ } @files;
            for my $path (@files) {
              open(my $fh, "<", $path) or next;
              my @lines = <$fh>; close $fh; chomp @lines;
              my %blocks; my $i = 0;
              while ($i < @lines) {
                if ($lines[$i] =~ /^static\s+inline\b[^\n\{;]*?\b(\w+)\s*\([^;\{]*\)\s*$/) {
                  my $name = $1;
                  if ($i+1 < @lines && $lines[$i+1] =~ /^\s*\{\s*$/) {
                    my $depth = 0; my $j = $i+1;
                    while ($j < @lines) {
                      $depth += ($lines[$j] =~ tr/\{//) - ($lines[$j] =~ tr/\}//);
                      last if $depth == 0; $j++;
                    }
                    push @{$blocks{$name}}, [$i, $j]; $i = $j+1; next;
                  }
                }
                $i++;
              }
              my @to_remove;
              for my $name (keys %blocks) {
                my @occs = @{$blocks{$name}};
                next if @occs < 2;
                my $first = join("\n", @lines[$occs[0][0]..$occs[0][1]]);
                for my $k (1..$#occs) {
                  my ($s,$e) = @{$occs[$k]};
                  my $body = join("\n", @lines[$s..$e]);
                  push @to_remove, [$s,$e,$name] if $body eq $first;
                }
              }
              next unless @to_remove;
              for my $r (sort { $b->[0] <=> $a->[0] } @to_remove) {
                my ($s,$e,$name) = @$r;
                print "::warning::Dedup $name duplikat di $path (baris ".($s+1)."-".($e+1).")\n";
                splice(@lines, $s, $e-$s+1);
                splice(@lines, $s, 1) while $s < @lines && $lines[$s] =~ /^\s*$/;
              }
              open(my $out, ">", $path) or next;
              print $out join("\n", @lines), "\n"; close $out;
            }
          '

      - name: Log & Bersihkan .rej (tidak menggagalkan build)
        run: |
          ALL_REJECTS=$(find . -name "*.rej" 2>/dev/null || true)
          if [ -n "$ALL_REJECTS" ]; then
            echo "::warning::Ada file .rej (hunk yang gagal apply otomatis, biasanya karena udah di-backport vendor tree). Isinya dicetak di bawah buat referensi, TIDAK menghentikan build:"
            for f in $ALL_REJECTS; do
              echo "--- $f ---"
              cat "$f"
            done
            find . -name "*.rej" -delete
          else
            echo "Nggak ada .rej, patch nempel bersih semua."
          fi

          NEW_SUBLEVEL=$(grep "^SUBLEVEL =" Makefile | awk '{print $3}')
          echo "SUBLEVEL sekarang setelah patch: $NEW_SUBLEVEL (target diminta: ${{ steps.ver.outputs.target }})"

      - name: Fix sound/usb/card.h (field stream_offset_adj hilang)
        run: |
          FILE="sound/usb/card.h"

          # BUG NYATA: hunk yang nambahin field "stream_offset_adj" ke struct
          # snd_usb_substream GAGAL apply (kena .rej), tapi hunk lain di
          # sound/usb/pcm.c yang MAKAI "subs->stream_offset_adj" BERHASIL
          # apply. Hasilnya: field dipakai padahal nggak pernah dideklarasi
          # -> compile error "no member named 'stream_offset_adj'".
          #
          # Fix murni aditif: tambahin field itu persis setelah
          # pkt_offset_adj, sama seperti upstream. Nggak nyentuh field lain
          # (framesize/sample_rem/sample_accum/fps di snd_usb_endpoint)
          # karena hunk penghapusnya JUGA gagal apply di tempat lain secara
          # konsisten -- jadi kode lama yang masih makai field-field itu
          # tetap aman/cocok, gak perlu ditambal.
          if grep -q "stream_offset_adj" "$FILE"; then
            echo "Field stream_offset_adj sudah ada, skip."
          elif grep -q "unsigned int pkt_offset_adj;" "$FILE"; then
            sed -i '/unsigned int pkt_offset_adj;/a\	unsigned int stream_offset_adj;	/* Bytes to drop from beginning of stream (for non-compliant devices) */' "$FILE"
            echo "Field stream_offset_adj ditambahin setelah pkt_offset_adj."
          else
            echo "::warning::Baris pkt_offset_adj nggak ketemu di $FILE -- kemungkinan struktur udah beda di level ini. Skip fix ini (bukan error fatal)."
          fi

          echo "--- Preview hasil fix ---"
          grep -n -B1 -A1 "stream_offset_adj" "$FILE" || true

      - name: Fix drivers/spi/spi-mt65xx.c (uninitialized reg_val)
        run: |
          FILE="drivers/spi/spi-mt65xx.c"

          # Hunk yang menghapus inisialisasi "reg_val = 0" -> "reg_val"
          # berhasil apply, tapi hunk pengganti logic-nya gagal (fungsi
          # vendor sudah dimodifikasi). Hasilnya reg_val kepake lewat "|="
          # padahal nggak pernah diinisialisasi -- uninitialized variable
          # yang langsung ditulis ke register hardware SPI. Idempotent.
          if grep -q "u32 spi_clk_hz, div, sck_time, cs_time, reg_val = 0;" "$FILE"; then
            echo "reg_val sudah terinisialisasi, skip."
          elif grep -q "u32 spi_clk_hz, div, sck_time, cs_time, reg_val;" "$FILE"; then
            sed -i 's/u32 spi_clk_hz, div, sck_time, cs_time, reg_val;/u32 spi_clk_hz, div, sck_time, cs_time, reg_val = 0;/' "$FILE"
            echo "Inisialisasi reg_val = 0 dikembalikan."
          else
            echo "::warning::Deklarasi reg_val di $FILE nggak ketemu pola yang diharapkan -- kemungkinan struktur fungsi sudah berubah lagi di level ini. Skip fix (bukan error fatal, tapi cek manual kalau ada masalah SPI)."
          fi

      - name: Fix drivers/usb/host/xhci-mtk.c (duplicate pm_runtime call)
        run: |
          FILE="drivers/usb/host/xhci-mtk.c"

          # Hunk penambah blok baru di awal xhci_mtk_remove() berhasil,
          # tapi hunk penghapus blok lama yang setara gagal (konteks beda).
          # Hasilnya pm_runtime_put_noidle()+pm_runtime_disable() dipanggil
          # dua kali -- bisa bikin refcount underflow pas suspend/rmmod.
          if [ -f "$FILE" ]; then
            COUNT=$(grep -c "pm_runtime_put_noidle(&dev->dev);" "$FILE" || true)

            if [ "$COUNT" -eq 1 ]; then
              echo "Cuma ada 1 pemanggilan, sudah bersih. Skip."
            elif [ "$COUNT" -ge 2 ]; then
              python3 - "$FILE" <<'PYEOF'
          import sys
          path = sys.argv[1]
          with open(path) as f:
              content = f.read()

          block = "\tpm_runtime_put_noidle(&dev->dev);\n\tpm_runtime_disable(&dev->dev);\n\n"
          first = content.find(block)
          second = content.find(block, first + len(block))

          if first == -1 or second == -1:
              print("::warning::Pola blok duplikat tidak ditemukan persis, skip fix ini.")
              sys.exit(0)

          content = content[:second] + content[second + len(block):]
          with open(path, "w") as f:
              f.write(content)
          print("Blok duplikat kedua dihapus.")
          PYEOF
            else
              echo "Pola pm_runtime_put_noidle nggak ketemu, kemungkinan udah beda di level ini. Skip."
            fi
          else
            echo "File $FILE nggak ada di level ini, skip."
          fi

      - name: Fix MediaTek SPI Timing Offset (macro hilang)
        run: |
          FILE="drivers/spi/spi-mt65xx.c"

          # BUG YANG BIKIN COMPILE ERROR: hunk yang harusnya ganti logic
          # reg_val (pakai SPI_CFG2_SCK_HIGH/LOW_OFFSET) gagal nempel di
          # fungsi vendor yang udah dimodif, tapi body fungsi TETAP makai
          # macro lama SPI_ADJUST_CFG0_SCK_LOW_OFFSET yang udah kehapus
          # dari header -- makanya "undeclared identifier". Nilai 16 ini
          # dikonfirmasi dari patch resmi MediaTek (Leilk Liu, "spi:
          # mediatek: adjust register to enhance time accuracy").
          if grep -q "^#define SPI_ADJUST_CFG0_SCK_LOW_OFFSET" "$FILE"; then
            echo "Guard sudah ada, skip insert."
          elif grep -q "SPI_ADJUST_CFG0_SCK_LOW_OFFSET" "$FILE"; then
            LAST_INCLUDE_LINE=$(grep -n '^#include' "$FILE" | tail -1 | cut -d: -f1)
            awk -v n="$LAST_INCLUDE_LINE" '{print} NR==n {print "#ifndef SPI_ADJUST_CFG0_SCK_LOW_OFFSET"; print "#define SPI_ADJUST_CFG0_SCK_LOW_OFFSET 16"; print "#endif"}' "$FILE" > "$FILE.tmp" && mv "$FILE.tmp" "$FILE"
            echo "Macro SPI_ADJUST_CFG0_SCK_LOW_OFFSET ditambahin (nilai 16)."
          else
            echo "Macro SPI_ADJUST_CFG0_SCK_LOW_OFFSET nggak dipakai di level ini, skip."
          fi

          echo "--- Preview hasil fix ---"
          grep -n -A3 -B3 "SPI_ADJUST_CFG0_SCK_LOW_OFFSET" "$FILE" || true

      - name: Fix lib/random32.c (net_rand_state static mismatch)
        run: |
          FILE="lib/random32.c"

          # Bukan dari .rej -- ini inkonsistensi lama di source: random32.c
          # deklarasi "static", tapi prandom.h deklarasi non-static (extern,
          # sengaja di-share ke file lain kayak net/core/utils.c). GCC cuma
          # warning soal ini, tapi clang (dipakai di build kita) jadiin error
          # keras. Fix: hapus "static" di random32.c biar cocok sama header.
          if grep -q "^static DEFINE_PER_CPU(struct rnd_state, net_rand_state)" "$FILE"; then
            sed -i 's/^static DEFINE_PER_CPU(struct rnd_state, net_rand_state)/DEFINE_PER_CPU(struct rnd_state, net_rand_state)/' "$FILE"
            echo "Keyword 'static' dihapus dari deklarasi net_rand_state."
          elif grep -q "^DEFINE_PER_CPU(struct rnd_state, net_rand_state)" "$FILE"; then
            echo "Sudah non-static, skip."
          else
            echo "Pola net_rand_state nggak ketemu di level ini, skip."
          fi

          echo "--- Preview hasil fix ---"
          grep -n "net_rand_state" "$FILE" || true

      - name: Tentukan freq & volt OC dari preset
        id: oc
        run: |
          case "${{ github.event.inputs.oc_step }}" in
            stock_no_oc)
              SKIP_OC=1 ;;
            step1_1307mhz)
              SKIP_OC=0; FREQ=1307000; VOLT=117500 ;;
            step2_1359mhz)
              SKIP_OC=0; FREQ=1359000; VOLT=120000 ;;
            step3_1411mhz)
              SKIP_OC=0; FREQ=1411000; VOLT=122500 ;;
            step4_1476mhz)
              SKIP_OC=0; FREQ=1476000; VOLT=125000 ;;
            step5_1580mhz)
              SKIP_OC=0; FREQ=1580000; VOLT=126875 ;;
            step6_1684mhz)
              SKIP_OC=0; FREQ=1684000; VOLT=128750 ;;
            step7_1801mhz_MAX_A01C)
              SKIP_OC=0; FREQ=1801000; VOLT=130625 ;;
            *)
              echo "::error::oc_step tidak dikenali: ${{ github.event.inputs.oc_step }}"
              exit 1
              ;;
          esac

          if [ "$SKIP_OC" -eq 1 ]; then
            echo "stock_no_oc dipilih, build polos tanpa patch OPP table."
            echo "skip_oc=1" >> "$GITHUB_OUTPUT"
          else
            MAX_SAFE_VOLT=130625
            if [ "$VOLT" -gt "$MAX_SAFE_VOLT" ]; then
              echo "::error::Voltase $VOLT melebihi batas aman terverifikasi ($MAX_SAFE_VOLT). Build dihentikan."
              exit 1
            fi

            echo "Step dipilih: ${{ github.event.inputs.oc_step }} -> FREQ=${FREQ}KHz, VOLT=${VOLT} (10uV)"
            echo "skip_oc=0" >> "$GITHUB_OUTPUT"
            echo "freq=$FREQ" >> "$GITHUB_OUTPUT"
            echo "volt=$VOLT" >> "$GITHUB_OUTPUT"
          fi

      - name: Backup file OPP table asli
        if: steps.oc.outputs.skip_oc == '0'
        run: |
          OPP_FILE="drivers/misc/mediatek/base/power/cpufreq_v2/src/mach/mt6739/mtk_cpufreq_opp_table.h"
          cp "$OPP_FILE" "$OPP_FILE.bak"

      - name: Patch OC (sementara, cuma di runner ini)
        if: steps.oc.outputs.skip_oc == '0'
        run: |
          OPP_FILE="drivers/misc/mediatek/base/power/cpufreq_v2/src/mach/mt6739/mtk_cpufreq_opp_table.h"
          FREQ="${{ steps.oc.outputs.freq }}"
          VOLT="${{ steps.oc.outputs.volt }}"

          sed -i "s/^#define CPU_DVFS_FREQ0_LL_FY\\t\\t[0-9]*\\t\\t\\/\\* KHz \\*\\//#define CPU_DVFS_FREQ0_LL_FY\\t\\t${FREQ}\\t\\t\\/* KHz - OC *\\//" "$OPP_FILE"
          sed -i "s/^#define CPU_DVFS_FREQ0_LL_SB\\t\\t[0-9]*\\t\\t\\/\\* KHz \\*\\//#define CPU_DVFS_FREQ0_LL_SB\\t\\t${FREQ}\\t\\t\\/* KHz - OC *\\//" "$OPP_FILE"
          sed -i "s/^#define CPU_DVFS_FREQ0_LL_FY2\\t\\t[0-9]*\\t\\t\\/\\* KHz \\*\\//#define CPU_DVFS_FREQ0_LL_FY2\\t\\t${FREQ}\\t\\t\\/* KHz - OC *\\//" "$OPP_FILE"

          sed -i "s/^#define CPU_DVFS_VOLT0_VPROC1_FY\\t [0-9]*\\t\\t\\/\\* 10uV \\*\\//#define CPU_DVFS_VOLT0_VPROC1_FY\\t ${VOLT}\\t\\t\\/* 10uV - OC *\\//" "$OPP_FILE"
          sed -i "s/^#define CPU_DVFS_VOLT0_VPROC1_SB\\t [0-9]*\\t\\t\\/\\* 10uV \\*\\//#define CPU_DVFS_VOLT0_VPROC1_SB\\t ${VOLT}\\t\\t\\/* 10uV - OC *\\//" "$OPP_FILE"
          sed -i "s/^#define CPU_DVFS_VOLT0_VPROC1_FY2\\t [0-9]*\\t\\t\\/\\* 10uV \\*\\//#define CPU_DVFS_VOLT0_VPROC1_FY2\\t ${VOLT}\\t\\t\\/* 10uV - OC *\\//" "$OPP_FILE"

      - name: Tampilkan diff hasil patch OC
        if: steps.oc.outputs.skip_oc == '0'
        run: |
          OPP_FILE="drivers/misc/mediatek/base/power/cpufreq_v2/src/mach/mt6739/mtk_cpufreq_opp_table.h"
          diff -u "$OPP_FILE.bak" "$OPP_FILE" || true

      - name: Build Kernel
        run: |
          chmod +x z
          ./z

      - name: Package Output
        run: |
          cd out/arch/arm/boot
          if [ -f "zImage-dtb" ]; then
            cp zImage-dtb boot.img-kernel
          else
            echo "::warning::zImage-dtb tidak ditemukan, fallback ke zImage (DTB terpisah)."
            cp zImage boot.img-kernel
          fi

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: TEST-RooXie-v${{ steps.ver.outputs.target }}-${{ github.event.inputs.oc_step }}
          path: out/arch/arm/boot/boot.img-kernel
